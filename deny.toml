[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "windows-projfs" },
    { crate = "libloot" },
    { crate = "libloadorder" },
    { crate = "esplugin" },
    { crate = "dokan" },
    { crate = "winfsp" },
    { crate = "winfsp_wrs" },
    { crate = "rhai" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
